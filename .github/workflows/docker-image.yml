
name: Docker Image CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish Docker image
        if: github.event_name == 'push'
        run: |
          docker tag "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" "ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}:latest"

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Simulate deployment
        run: |
          echo "Starting deployment..."
          echo "Image: ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "Deployment completed successfully!"
